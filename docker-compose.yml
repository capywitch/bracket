version: '3.8'

services:
  web_bracket:
    build:
      context: .
      dockerfile: web/Dockerfile
      secrets:
        - npm_token
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      - MTG_API_URL=${API_URL:-http://api_bracket:8000}
      - MTG_API_KEY=${API_KEY}
      # Oracle (tcgrp.oracle): preços de referência no modal da carta. Vazio = sem preços.
      - ORACLE_API_URL=${ORACLE_API_URL:-}
    volumes:
      - mtg_card_image_cache:/app/web/.cache/card-images
    depends_on:
      api_bracket:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  api_bracket:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # No expose/ports published: the api stays internal-only, reachable by
    # `web_bracket` over the Docker network Coolify injects. Never routed by Traefik.
    restart: unless-stopped
    environment:
      - API_KEY=${API_KEY}
    volumes:
      - mtg_data:/app/data
    # /health é público (UNAUTHENTICATED_PATHS) — não precisa de API_KEY.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  mtg_data:
    name: mtg_data_vol
  mtg_card_image_cache:
    name: mtg_card_image_cache_vol

secrets:
  # Token do GitHub Packages (read:packages) para instalar @capywitch/ui no
  # build da imagem web. No Coolify, defina via "Build Secrets" apontando
  # pra um arquivo/variável — NUNCA como ENV normal (viraria ARG no layer).
  npm_token:
    environment: NPM_TOKEN
