[project]
name = "mtg-analyzer"
version = "0.1.0"
description = "Local Magic: The Gathering Commander deck analyzer, simulator, and recommender"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",          # Scryfall / external API calls (async, sets custom User-Agent)
    "pydantic>=2.9",        # domain models + API schemas
    "numpy>=2.1",           # Monte-Carlo simulation
    "scipy>=1.14",          # hypergeometric probability
    "ijson>=3.3",           # streaming parse of large Scryfall bulk JSON (memory-bounded)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
mtg = "mtg_analyzer.cli:main"   # thin CLI over the engine (optional convenience)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/mtg_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: codebase usa linhas longas (prosa/URLs em strings); formatter não quebra
# strings e comentários, então fica desligada aqui.
# B008: Depends() como default de argumento é padrão idiomático do FastAPI.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# B023: closures equity_gate/is_spoiler são definidas dentro do loop de turnos
# mas consumidas na mesma iteração (não escapam) — falso positivo.
"backend/mtg_analyzer/simulation/battle.py" = ["B023"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.mypy]
mypy_path = "backend"
files = ["backend/mtg_analyzer"]

[[tool.mypy.overrides]]
module = ["ijson.*", "scipy.*"]
ignore_missing_imports = true
